<h2 mat-dialog-title>Add a new user</h2>

<div mat-dialog-content>
    <form [formGroup]="addUserForm">
        <mat-form-field>
            <input matInput placeholder="Username" formControlName="username">
        </mat-form-field>

        @if (selectedProjectCache().isLoading) {
            <mat-spinner>Please wait...</mat-spinner>
        }
        @if (selectedProjectCache().error) {}
        @else {
            <mat-error>{{ selectedProjectCache().error }}</mat-error>
        }
    </form>
</div>

<div mat-dialog-actions align="end">
    <button mat-button (click)="close()" [disabled]="selectedProjectCache().isLoading">Close</button>
    <button mat-flat-button (click)="submit()" [disabled]="addUserForm.invalid || selectedProjectCache().isLoading">Add</button>
</div>
